<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma'had Miftah al-'Ilm - Score Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
</head>
<body>

<header>
  <button class="teacher-tag" id="teacherTag"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Teacher</button>
  <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
  <h1>معهد مفتاح العلم</h1>
  <h2>Ma'had Miftah al-'Ilm &bull; Score Portal</h2>
</header>

<div class="nav-tabs" id="navTabs">
  <button class="tab-btn active" data-tab="directory"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Directory</button>
  <button class="tab-btn" data-tab="leaderboard"><svg class="icon" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4a2 2 0 0 0 0 4h1M17 6h3a2 2 0 0 1 0 4h-1"/></svg>Leaderboard</button>
  <button class="tab-btn" data-tab="overview"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>Full Sheet</button>
  <button class="tab-btn" data-tab="manage" id="manageTabBtn" style="display:none;"><svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>Manage Students</button>
</div>

<div class="container">
  <div id="statusArea"></div>

  <div id="tab-directory" class="tab-content active">
    <input type="text" id="search" class="search-box" placeholder="Search student name...">
    <div id="studentGrid" class="student-grid"></div>
  </div>

  <div id="tab-leaderboard" class="tab-content">
    <div id="leaderboardList" class="leaderboard-list"></div>
  </div>

  <div id="tab-overview" class="tab-content">
    <div class="table-wrapper">
      <table>
        <thead><tr id="tableHeader"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <div id="tab-manage" class="tab-content">
    <div id="manageArea"></div>
  </div>
</div>

<div id="scoreModal" class="modal-overlay">
  <div class="modal-content">
    <button class="close-btn" id="modalClose">&times;</button>
    <div class="modal-header">
      <h3 id="modalName">Student Name</h3>
      <p id="modalSN">S/N: --</p>
    </div>
    <div class="score-summary-box">
      <div class="total-val" id="modalTotal">0</div>
      <div class="total-lbl">Total Accumulated Score (max 100)</div>
    </div>
    <div class="score-grid" id="modalScoreGrid"></div>
    <div id="modalEditWrap" style="display:none;"></div>
  </div>
</div>

<div id="scoreEditModal" class="modal-overlay">
  <div class="modal-content">
    <button class="close-btn" id="scoreEditClose">&times;</button>
    <div class="modal-header">
      <h3 id="editModalName">Student Name</h3>
      <p id="editModalTotal">Total: 0 / 100</p>
    </div>

    <div id="editPickerView">
      <p style="text-align:center; font-size:0.85rem; color:var(--text-muted); margin-bottom:12px;">Select a day to edit</p>
      <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;" id="editDayDots"></div>
      <div class="save-hint" id="editPickerHint" style="margin-top:14px; text-align:center;"></div>
    </div>

    <div id="editFormView" style="display:none;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px;">
        <button class="ghost-btn" id="editBackToDays">&larr; Days</button>
        <div style="font-weight:700; color:var(--emerald-dark); font-size:1.05rem;" id="editDayLabel">Day 1</div>
        <span style="width:64px;"></span>
      </div>
      <div class="day-grid" style="grid-template-columns: 1fr; gap:12px;">
        <div class="day-field">
          <label>Score (0-<span id="editDayMaxLabel">10</span>)</label>
          <input type="number" min="0" max="10" step="1" id="editDayScoreInput" placeholder="0-10">
        </div>
        <div class="day-field">
          <label>Bonus units for this day (each = <span id="editBonusValLabel">2</span> pts)</label>
          <input type="number" min="0" step="1" id="editDayBonusInput" placeholder="0">
        </div>
      </div>
      <div class="entry-footer" style="margin-top:16px;">
        <button class="save-btn" id="editSaveBtn" style="width:100%; justify-content:center;"><svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Save Day <span id="editSaveDayLabel">1</span></button>
      </div>
      <div class="save-hint" id="editHint" style="margin-top:10px; text-align:center;"></div>
    </div>
  </div>
</div>

<div id="confirmOverlay" class="confirm-overlay">
  <div class="confirm-box">
    <h4 id="confirmTitle">Are you sure?</h4>
    <p id="confirmBody">This cannot be undone.</p>
    <div class="confirm-actions">
      <button class="ghost-btn" id="confirmCancel">Cancel</button>
      <button class="danger-btn" id="confirmOk">Confirm</button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
